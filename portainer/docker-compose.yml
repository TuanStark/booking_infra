version: '3.9'

services:
  portainer:
    image: portainer/portainer-ce:latest
    container_name: booking_portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
      - "9443:9443"  # HTTPS port (optional)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
      - ./admin-password.txt:/tmp/admin-password.txt:ro  # Mật khẩu admin (plain text)
    networks:
      my_custom_network:
        ipv4_address: 10.0.0.100
    command: 
      - -H
      - unix:///var/run/docker.sock
      - --admin-password-file
      - /tmp/admin-password.txt
    environment:
      - PORTAINER_TLS=true
      - PORTAINER_SSL=true

volumes:
  portainer_data:
    driver: local

networks:
  my_custom_network:
    external: true

